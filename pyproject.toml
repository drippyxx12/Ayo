[project]
name = "ayo-merchant-alpha"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.14,<2",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "cryptography>=50,<51",
  "python-multipart>=0.0.10,<1",
  "itsdangerous>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Adopt correctness rules first; formatting/unused-import cleanup is separate.
select = ["E9", "F63", "F7", "F82"]
