{% macro icon(name, size=20) -%}
<svg class="ayo-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'home' %}<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>
{% elif name == 'research' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M8 8h5m-5 4h3"/>
{% elif name == 'ayo' %}<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4 18.4 5.6"/><circle cx="12" cy="12" r="4"/>
{% elif name == 'work' %}<rect x="4" y="5" width="16" height="16" rx="3"/><path d="M9 3h6v4H9Zm-1 10 2 2 6-6"/>
{% elif name == 'grow' %}<path d="M4 20V10m6 10V6m6 14v-5M3 5l5-2 7 5 6-5m-5 0h5v5"/>
{% elif name == 'business' %}<path d="M4 21V7l8-4 8 4v14M2 21h20M8 9h1m6 0h1M8 13h1m6 0h1m-6 8v-4h4v4"/>
{% elif name == 'activity' %}<path d="M2 12h4l3-8 5 16 3-8h5"/>
{% elif name == 'connections' %}<path d="m8 15-2 2a4 4 0 0 1-5-5l5-5a4 4 0 0 1 5 0m2 2 2-2a4 4 0 0 1 5 5l-5 5a4 4 0 0 1-5 0M8 12l8-8" transform="translate(1 2)"/>
{% elif name == 'settings' %}<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--cream)"/><circle cx="15" cy="17" r="3" fill="var(--cream)"/>
{% elif name == 'help' %}<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.5 1.5c-1 1-2 1-2 3M12 17h.01"/>
{% elif name == 'arrow' %}<path d="M5 12h14m-6-6 6 6-6 6"/>
{% elif name == 'source' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h3"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% endif %}</svg>
{%- endmacro %}
