{% extends "base.html" %}
{% block title %}Set up your business — Ayo{% endblock %}
{% block body %}<main class="wrap authwrap" id="main-content"><h1 class="auth-title">Your business,<br>your context.</h1><p>Choose your business market. This does not verify ownership or connect a provider.</p>{% if error %}<div class="notice" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/business/setup" class="auth-form"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="business-name">Business name</label><input id="business-name" name="business_name" required minlength="2" maxlength="160"><label for="country">Market</label><select id="country" name="country" required><option value="">Select a market</option><option value="NG">Nigeria</option><option value="GH">Ghana</option></select><button class="pill full" type="submit">Create workspace ↗</button></form></main>{% endblock %}
